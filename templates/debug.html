<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/favicon.png') }}">
</head>

<body class="debug">
    <nav class="navbar">
        <div class="logo">
            <a href="https://aspectofthe.site/" class="logo">
                <img src="{{ url_for('static', filename='icons/favicon.png') }}" alt="Logo" class="logo-img">
            </a>
            Debug
        </div>
    </nav>

    <div class="debug-navigator">
        <button onclick="document.getElementById('user-management').style.display='block';document.getElementById('bot-management').style.display='none';document.getElementById('world-management').style.display='none';">
            Open User Management
        </button>

        <button onclick="document.getElementById('bot-management').style.display='block';document.getElementById('user-management').style.display='none';document.getElementById('world-management').style.display='none';">
            Open Bot Management
        </button>

        <button onclick="document.getElementById('world-management').style.display='block';document.getElementById('user-management').style.display='none';document.getElementById('bot-management').style.display='none';">
            Open World Management
        </button>
    </div>

    <div id="user-management" style="display: none;">
        <h2>User Management</h2>
         <div id="user-list">
            <p>Loading users...</p>
        </div>

        <div id="user-options" style="display: none;">
            <button onclick="displayUsers(window.data)">Back to User List</button>
            <h3>User data</h3>
            <div id="user-data">
                <textarea id="user-data-textarea" style="width: 100%; height: 200px;"></textarea>
            </div>
            <h3>User Options</h3>
            <div id="user-permissions"></div>
            <h3>Trusted</h3>
            <label>
                <input type="checkbox" id="trusted-checkbox">
                Trusted
            </label>
            <h3>User Flags</h3>
            <div id="user-flags"></div>
            <h3>Eggs Obtained</h3>
            <div id="user-eggs"></div>
        </div>
    </div>

    <div id="bot-management" style="display: none;">
        <h2>Bot Management</h2>
        <div class="bot-management-controls">
            <div class="custom-dropdown debug-filter-dropdown">
                <div class="dropdown-selected">Bots: <span id="bot-filter-label">All</span></div>
                <div id="bot-filter-options" class="dropdown-options"></div>
            </div>
            <div class="custom-dropdown debug-filter-dropdown">
                <div class="dropdown-selected">Messages: <span id="message-filter-label">All</span></div>
                <div id="message-filter-options" class="dropdown-options">
                    <label class="dropdown-option"><input type="checkbox" value="chat" checked> Chat</label>
                    <label class="dropdown-option"><input type="checkbox" value="debug" checked> Debug</label>
                    <label class="dropdown-option"><input type="checkbox" value="requests" checked> Requests</label>
                </div>
            </div>
        </div>
        <div id="bot-management-log" class="bot-management-log"></div>
        <div id="bot-screenshot-gallery" class="bot-screenshot-gallery"></div>
        <div class="bot-action-controls">
            <label for="bot-action-select" class="headerlabel">Bot:</label>
            <select id="bot-action-select" class="dropdown"></select>
            <div class="controls">
                <button title="Disconnect bot" id="debug-disconnect-btn" class="disconnect-button">
                    <img src="{{ url_for('static', filename='icons/disconnect.svg') }}" class="disconnect-icon" alt="Disconnect">
                </button>
                <button title="Switch server" id="debug-switch-server-btn" class="switch-server-button">
                    <img src="{{ url_for('static', filename='icons/switch.svg') }}" class="switch-icon" alt="Switch Server">
                </button>
                <button title="Screenshot" id="debug-screenshot-btn" class="screenshot-button">
                    <img src="{{ url_for('static', filename='icons/screenshot.svg') }}" class="camera-icon" alt="Screenshot">
                </button>
                <button title="Chat" id="debug-chat-btn" class="debug-chat-button">Chat</button>
            </div>
            <label for="debug-world-uuid" class="headerlabel">Deploy world:</label>
            <div class="world-input-wrapper debug-world-wrapper">
                <textarea id="debug-world-uuid" class="world-uuid" placeholder="World UUID (or empty for Lobby)" aria-label="Deploy world"></textarea>
                <div id="debug-world-suggestions" class="world-suggestions"></div>
            </div>
            <button id="debug-deploy-btn" class="button">Deploy</button>
        </div>
    </div>

    <div id="world-management" style="display: none;">
        <h2>World Management</h2>
    </div>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js" crossorigin="anonymous"></script>
<script>
    const token = "{{ token }}";
    const abilitydefaults = {{ abilitydefaults|tojson }};
    
    fetch(`https://api.aspectofthe.site/debug/getdata`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ token: token })
    })
        .then(response => response.json())
        .then(data => {
            window.data = data.value;
            displayUsers(data.value)
            setupBotManagement(data.value.bot || {});
        })
        .catch(error => {
            console.error('Error fetching data:', error);
        });

    function setupBotManagement(bots) {
        const log = document.getElementById('bot-management-log');
        const gallery = document.getElementById('bot-screenshot-gallery');
        const botOptions = document.getElementById('bot-filter-options');
        const messageOptions = document.getElementById('message-filter-options');
        const selectedBots = new Set(Object.keys(bots));
        const selectedMessages = new Set(['chat', 'debug', 'requests']);
        const actionSelect = document.getElementById('bot-action-select');

        Object.keys(bots).forEach(bot => {
            const option = document.createElement('option');
            option.value = bot;
            option.textContent = bot;
            actionSelect.appendChild(option);
        });

        Object.keys(bots).forEach(bot => {
            const label = document.createElement('label');
            label.className = 'dropdown-option';
            label.innerHTML = `<input type="checkbox" value="${bot}" checked> ${bot}`;
            botOptions.appendChild(label);
        });

        document.querySelectorAll('.debug-filter-dropdown').forEach(dropdown => {
            dropdown.addEventListener('click', event => event.stopPropagation());
            dropdown.querySelector('.dropdown-selected').addEventListener('click', event => {
                document.querySelectorAll('.debug-filter-dropdown').forEach(item => {
                    if (item !== dropdown) item.classList.remove('open');
                });
                dropdown.classList.toggle('open');
            });
        });
        document.addEventListener('click', () => document.querySelectorAll('.debug-filter-dropdown').forEach(item => item.classList.remove('open')));

        function updateFilters() {
            selectedBots.clear();
            botOptions.querySelectorAll('input:checked').forEach(input => selectedBots.add(input.value));
            selectedMessages.clear();
            messageOptions.querySelectorAll('input:checked').forEach(input => selectedMessages.add(input.value));
            document.getElementById('bot-filter-label').textContent = selectedBots.size === Object.keys(bots).length ? 'All' : `${selectedBots.size} selected`;
            document.getElementById('message-filter-label').textContent = selectedMessages.size === 3 ? 'All' : `${selectedMessages.size} selected`;
            log.querySelectorAll('.bot-log-entry').forEach(entry => {
                entry.style.display = selectedBots.has(entry.dataset.bot) && selectedMessages.has(entry.dataset.category) ? '' : 'none';
            });
            gallery.querySelectorAll('.bot-screenshot').forEach(entry => {
                entry.style.display = selectedBots.has(entry.dataset.bot) ? '' : 'none';
            });
        }

        botOptions.addEventListener('change', updateFilters);
        messageOptions.addEventListener('change', updateFilters);

        const socket = io('https://aspectofthe.site', { transports: ['websocket'] });
        Object.keys(bots).forEach(bot => socket.emit('join', `debug-${bot}`));
        socket.on('log', contents => {
            const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 50;
            const entry = document.createElement('div');
            entry.className = 'bot-log-entry';
            entry.dataset.bot = contents[3] || '';
            entry.dataset.category = contents[2] || 'chat';
            const categoryLabels = { debug: 'DEBUG', chat: 'CHAT', requests: 'REQUEST' };
            const category = entry.dataset.category;
            entry.innerHTML = `<span class="bot-log-source">[${entry.dataset.bot}] [${contents[0]}]</span> <span class="bot-log-type bot-log-type-${category}">[${categoryLabels[category] || category.toUpperCase()}]</span> <span class="bot-log-message">${contents[1]}</span><br>`;
            log.appendChild(entry);
            updateFilters();
            if (nearBottom) log.scrollTop = log.scrollHeight;
        });

        socket.on('screenshot', screenshot => {
            const bot = screenshot.bot || '';
            const figure = document.createElement('figure');
            figure.className = 'bot-screenshot';
            figure.dataset.bot = bot;
            const image = document.createElement('img');
            image.src = `data:image/png;base64,${screenshot.image}`;
            image.alt = `Screenshot from ${bot}`;
            const caption = document.createElement('figcaption');
            caption.textContent = bot;
            figure.append(image, caption);
            gallery.appendChild(figure);
            updateFilters();
        });

        function selectedBot() {
            return actionSelect.value;
        }

        document.getElementById('debug-screenshot-btn').addEventListener('click', () => {
            socket.emit('get_screenshot', { bot: selectedBot() });
        });
        document.getElementById('debug-disconnect-btn').addEventListener('click', () => {
            socket.emit('bot_disconnect', { bot: selectedBot() });
        });
        document.getElementById('debug-switch-server-btn').addEventListener('click', () => {
            const world = prompt('World UUID');
            if (world !== null) socket.emit('bot_switch_server', { bot: selectedBot(), world });
        });
        document.getElementById('debug-chat-btn').addEventListener('click', () => {
            const message = prompt('Message');
            if (message !== null) socket.emit('bot_chat', { bot: selectedBot(), msg: message });
        });

        setupDebugDeployment(bots, token, '{{ mcuuid }}');

        let activeTooltip = null;

        function removeTooltip() {
            if (activeTooltip) {
                activeTooltip.remove();
                activeTooltip = null;
            }
        }

        log.addEventListener('mouseover', event => {
            const span = event.target.closest('span[data-hover]');
            if (!span) return;

            removeTooltip();
            const popup = document.createElement('div');
            popup.classList.add('hover-popup');

            try {
                const hoverData = JSON.parse(span.dataset.hover);

                function renderHover(data) {
                    if (Array.isArray(data)) return data.map(renderHover).join('');
                    if (data.components) return data.components.map(renderHover).join('');

                    let style = '';
                    if (data.style) {
                        if (data.style.color) style += `color:${data.style.color};`;
                        if (data.style.isBold) style += 'font-weight:bold;';
                        if (data.style.isItalic) style += 'font-style:italic;';
                        if (data.style.isUnderlined) style += 'text-decoration:underline;';
                        if (data.style.isStrikethrough) style += 'text-decoration:line-through;';
                    }

                    return `<span style="${style}">${(data.text || '').replace(/\n/g, '<br>')}</span>`;
                }

                popup.innerHTML = renderHover(hoverData);
            } catch (error) {
                popup.textContent = span.dataset.hover;
            }

            document.body.appendChild(popup);
            popup.style.display = 'block';
            activeTooltip = popup;
        });

        document.addEventListener('mousemove', event => {
            if (!activeTooltip) return;
            activeTooltip.style.left = `${event.clientX + 12}px`;
            activeTooltip.style.top = `${event.clientY + 12}px`;
        });

        log.addEventListener('mouseout', event => {
            if (event.target.closest('span[data-hover]')) removeTooltip();
        });

        log.addEventListener('click', event => {
            const span = event.target.closest('span[data-click]');
            if (!span) return;

            const clickData = JSON.parse(span.dataset.click);
            const overlay = document.createElement('div');
            overlay.classList.add('click-confirm');

            let html = `<p>Would you like to ${clickData.type === 'OPEN_URL' ? 'open this URL?' : 'copy to clipboard?'}</p>`;
            html += `<pre>${clickData.command}</pre>`;
            html += '<button class="copy">Copy</button>';
            if (clickData.type === 'OPEN_URL') html += '<button class="open">Open URL</button>';
            html += '<button class="cancel">Cancel</button>';
            overlay.innerHTML = html;
            document.body.appendChild(overlay);
            overlay.style.display = 'block';

            overlay.querySelector('button.copy')?.addEventListener('click', () => {
                navigator.clipboard.writeText(clickData.command);
                overlay.remove();
            });
            overlay.querySelector('button.open')?.addEventListener('click', () => {
                window.open(clickData.command, '_blank');
                overlay.remove();
            });
            overlay.querySelector('button.cancel').addEventListener('click', () => overlay.remove());
        });
    }

    function setupDebugDeployment(bots, deployToken, accountUUID) {
        const worldBox = document.getElementById('debug-world-uuid');
        const suggestionBox = document.getElementById('debug-world-suggestions');
        const botSelect = document.getElementById('bot-action-select');
        const deployButton = document.getElementById('debug-deploy-btn');
        let allWorlds = [];
        let ownedWorlds = [];
        let worldsLoaded = false;

        function formatUUID(uuid) {
            const value = uuid.replace(/-/g, '').trim();
            return `${value.slice(0, 8)}-${value.slice(8, 12)}-${value.slice(12, 16)}-${value.slice(16, 20)}-${value.slice(20)}`;
        }

        function showSuggestions(worlds) {
            if (!worlds.length) {
                suggestionBox.style.display = 'none';
                return;
            }

            suggestionBox.innerHTML = '';
            worlds.slice(0, 10).forEach(world => {
                const item = document.createElement('div');
                item.className = 'world-suggestion';
                item.textContent = world.name;
                item.addEventListener('click', () => {
                    worldBox.value = world.world_uuid;
                    suggestionBox.style.display = 'none';
                });
                suggestionBox.appendChild(item);
            });
            suggestionBox.style.display = 'block';
        }

        worldBox.addEventListener('focus', () => {
            if (worldsLoaded && worldBox.value.trim() === '') showSuggestions(ownedWorlds);
        });
        worldBox.addEventListener('input', () => {
            if (!worldsLoaded) return;
            const query = worldBox.value.trim();
            if (!query) {
                showSuggestions(ownedWorlds);
                return;
            }
            showSuggestions(allWorlds.filter(world => new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i').test(world.name)));
        });
        document.addEventListener('click', event => {
            if (!worldBox.contains(event.target) && !suggestionBox.contains(event.target)) suggestionBox.style.display = 'none';
        });

        Promise.all([
            fetch('https://api.legiti.dev/top/0').then(response => response.json()),
            fetch(`https://api.legiti.dev/owner/${formatUUID(accountUUID)}`).then(response => response.json())
        ]).then(([worlds, owned]) => {
            allWorlds = worlds;
            ownedWorlds = owned;
            worldsLoaded = true;
        }).catch(error => console.error('Failed to load debug deployment worlds:', error));

        deployButton.addEventListener('click', async () => {
            deployButton.disabled = true;
            try {
                const response = await fetch('https://api.aspectofthe.site/bots/deploy', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        account: accountUUID,
                        token: deployToken,
                        bot: botSelect.value,
                        world: worldBox.value
                    })
                });
                if (!response.ok) console.error('Debug deploy failed:', await response.text());
            } catch (error) {
                console.error('Debug deploy failed:', error);
            } finally {
                deployButton.disabled = false;
            }
        });
    }

    function displayUsers(data) {
        // display list of users

        const userList = document.getElementById('user-list');
        userList.innerHTML = '';
        document.getElementById('user-options').style.display = 'none';
        document.getElementById('user-data').innerHTML = '<textarea id="user-data-textarea" style="width: 100%; height: 200px;"></textarea>';
        document.getElementById('user-permissions').innerHTML = '';
        document.getElementById('user-flags').innerHTML = '';
        document.getElementById('user-eggs').innerHTML = '';
        Object.entries(data.account).forEach(([uuid, user]) => {
            const button = document.createElement('button');
            button.innerHTML = `<img src="https://mc-heads.net/avatar/${uuid}/32" alt="?" style="vertical-align: middle; margin-right: 8px;"> ${user.username}`;
            button.title = uuid;
            button.onclick = () => displayUserData(uuid, user);
            userList.appendChild(button);
        });
    }

    function displayUserData(uuid, user) {
        // display user's data and stuff

        const userList = document.getElementById('user-list');
        userList.innerHTML = '';

        const escapedUser = JSON.stringify(user, null, 4)
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
        const userDataDiv = document.getElementById('user-data');
        userDataDiv.querySelector('#user-data-textarea').value = escapedUser;

        const saveNewData = document.createElement('button');
        saveNewData.textContent = 'Save New Data';
        saveNewData.onclick = () => {
            const newData = JSON.parse(document.getElementById('user-data-textarea').value);
            fetch(`https://api.aspectofthe.site/debug/setaccountdata`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    account: uuid,
                    data: newData,
                    token: token
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('User data saved:', data);
                window.data.account[uuid] = newData;
            })
            .catch(error => {
                console.error('Error saving user data:', error);
            });
        };
        userDataDiv.appendChild(saveNewData);

        // setup permissions

        const permissions = {
            "send": {"type": "boolean", "text": "Can send messages through bots"},
            "unowned": {"type": "boolean", "text": "Deploy on unowned worlds"},
            "abandoned": {"type": "boolean", "text": "Whether bot leaves when abandoned"},
            "simultaneous": {"type": "int", "text": "How many bots can be deployed at once"},
            "uptime": {"type": "int", "text": "How long bots can be deployed for (minutes)"},
            "uses": {"type": "int", "text": "Times bots can be deployed per day"},
            "capacity": {"type": "int", "text": "Capacity of User Storage (MB)"},
        };

        for (const [permission, info] of Object.entries(permissions)) {
            if (abilitydefaults.hasOwnProperty(permission)) {
                info.default = abilitydefaults[permission];
            }
        }

        // user permissions

        const permissionTable = document.createElement('table');
        for (const [permission, info] of Object.entries(permissions)) {
            const row = document.createElement('tr');
            const nameCell = document.createElement('td');
            nameCell.textContent = info.text;
            const inputCell = document.createElement('td');
            let input;
            if (info.type === "boolean") {
                input = document.createElement('input');
                input.type = 'checkbox';
                input.checked = user.abilities && user.abilities[permission] === true ? user.abilities[permission] : info.default;
            } else if (info.type === "int") {
                input = document.createElement('input');
                input.type = 'number';
                input.value = user.abilities && user.abilities[permission] ? user.abilities[permission] : info.default;
            }
            input.onchange = () => {
                const value = info.type === "boolean" ? input.checked : parseInt(input.value);
                fetch(`https://api.aspectofthe.site/debug/permission`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        account: uuid,
                        permission: permission,
                        value: value,
                        token: token
                    })
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Permission updated:', data);
                    window.data.account[uuid].abilities[permission] = value;
                })
                .catch(error => {
                    console.error('Error updating permission:', error);
                });
            };
            inputCell.appendChild(input);
            row.appendChild(nameCell);
            row.appendChild(inputCell);
            permissionTable.appendChild(row);
        }
        document.getElementById('user-permissions').appendChild(permissionTable);
        document.getElementById('user-options').style.display = 'block';

        // trusted checkbox

        document.getElementById('trusted-checkbox').checked = user.trusted === true;
        document.getElementById('trusted-checkbox').onchange = () => {
            fetch(`https://api.aspectofthe.site/debug/trusted`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    account: uuid,
                    token: token
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Trusted toggled:', data);
                window.data.account[uuid].trusted = !window.data.account[uuid].trusted;
            })
            .catch(error => {
                console.error('Error toggling trusted:', error);
            });
        };

        // edit user flags

        const flagsTable = document.createElement('table');
        let flags = user.flag || {};
        let defaultFlags = {"0": true};
        for (const flag in defaultFlags) {
            if (!flags.hasOwnProperty(flag)) {
                flags[flag] = defaultFlags[flag];
            }
        }
        for (const [flag, value] of Object.entries(flags)) {
            const row = document.createElement('tr');
            const nameCell = document.createElement('td');
            nameCell.textContent = flag;
            const inputCell = document.createElement('td');
            const input = document.createElement('input');
            input.type = 'checkbox';
            input.checked = value === true;
            input.onchange = () => {
                const newValue = input.checked;
                fetch(`https://api.aspectofthe.site/debug/setflag`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        account: uuid,
                        flag: flag,
                        value: newValue,
                        token: token
                    })
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Flag updated:', data);
                    window.data.account[uuid].flag[flag] = newValue;
                })
                .catch(error => {
                    console.error('Error updating flag:', error);
                });
            };
            inputCell.appendChild(input);
            row.appendChild(nameCell);
            row.appendChild(inputCell);
            flagsTable.appendChild(row);
        }

        document.getElementById('user-flags').appendChild(flagsTable);

        // edit user egg data

        const eggTable = document.createElement('table');
        for (const [worldUUID, eggInfo] of Object.entries(window.data.egg)) {
            const row = document.createElement('tr');
            const nameCell = document.createElement('td');
            nameCell.textContent = worldUUID;
            const inputCell = document.createElement('td');
            const input = document.createElement('input');
            input.type = 'checkbox';
            input.checked = user.man && user.man[worldUUID] === true ? user.man[worldUUID] : false;
            input.onchange = () => {
                const value = input.checked;
                fetch(`https://api.aspectofthe.site/debug/setman`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        account: uuid,
                        man: {
                            world: worldUUID,
                            value: value
                        },
                        token: token
                    })
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Man data updated:', data);
                    window.data.account[uuid].man[worldUUID] = value;
                })
                .catch(error => {
                    console.error('Error updating man data:', error);
                });
            };
            inputCell.appendChild(input);
            row.appendChild(nameCell);
            row.appendChild(inputCell);
            eggTable.appendChild(row);
        }
        document.getElementById('user-eggs').appendChild(eggTable);
    }
</script>
</body>
</html>
